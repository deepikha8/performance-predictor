<!DOCTYPE html>
<html>
<head>
    <title>Home - AI Student Performance Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: url('https://images.hdqwalls.com/download/ocean-blue-abstract-xt-3840x2160.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .nav-bar a {
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-bar a:hover {
            background: rgba(0,0,0,0.7);
        }

        .center-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 20px;
        }

        .center-content h1 {
            font-size: 28px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 12px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            .center-content h1 {
                font-size: 20px;
                padding: 15px;
            }

            .nav-bar a {
                font-size: 14px;
                padding: 8px 15px;
            }
        }
    </style>
</head>

        <a href="performance_register.html">Register</a>
    </div>

    <div class="center-content">
        <h1>"AI STUDENT PERFORMANCE PREDICTOR"</h1>
    </div>

</body>
</html>
